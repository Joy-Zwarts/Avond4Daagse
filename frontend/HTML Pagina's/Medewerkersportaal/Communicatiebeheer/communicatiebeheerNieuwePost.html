    </header>
    <section class="page-head"><h1>Nieuwe post</h1><p>Publiceer een nieuwsbericht voor deelnemers.</p></section>
    <main class="container">
        <form class="card post-form" id="new-post-form">
            <h2 class="panel-title">Coverfoto uploaden</h2>
            <label class="upload" for="post-image"><b>⇧</b><span>Sleep bestanden hierheen of klik om te bladeren</span><small id="image-name">JPG of PNG tot 10 MB</small></label>
            <input id="post-image" type="file" accept="image/png,image/jpeg" hidden>
            <label for="post-title">Titel</label>
            <input class="input" id="post-title" type="text" placeholder="Typ hier de titel van je post..." required>
            <label for="post-description">Beschrijving</label>
            <input class="input" id="post-description" type="text" placeholder="Typ hier de beschrijving van je post..." required>
            <label for="post-content">Inhoud</label>
            <textarea id="post-content" placeholder="Typ hier de inhoud van je post..." required></textarea>
            <label class="checkbox-label"><input id="newsletter" type="checkbox"><span>Stuur een update naar de mensen in de nieuwsbrief</span></label>
            <button class="button full" type="submit">➤ Publiceer post</button>
        </form>
    </main>
</body>

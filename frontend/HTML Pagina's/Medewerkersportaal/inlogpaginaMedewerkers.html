<!DOCTYPE html>

<html lang="nl">
    <head>
        <meta charset="UTF-8">
        <title>Inlogpagina Medewerkers</title>
        <meta name="description" content="De inlogpagina voor de medewerkers van de Avond4Daagse van de regio Den Haag">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="inlogpaginaMedewerkers.css">

        <script src="https://kit.fontawesome.com/ac06c0bab5.js" crossorigin="anonymous"></script>
    </head>

    <body>
        <header>
            <nav>
                <a class="logo" href="../landingspagina.html">
                    <img src="../Images/avond4daagseLogo.png" alt="Avond4Daagse logo">
                </a>

                <div class="regioLabel">
                    <span class="pin"><i class="fa-solid fa-users"></i></span>
                    Avond4Daagse Den Haag medewerkersportaal
                </div>
            </nav>
        </header>
        <main>
            <div id="loginCard">
                    <section class="loginCardTop">
                        <div>
                            <h1>Log in als medewerker</h1>
                            <p>
                                Demoaccount <strong>jane@voorbeeld.nl</strong><br>
                                Startwachtwoord <code>Avond4daagse!</code>
                            </p>
                        </div>
                    </section>
                    <form id="loginForm">
                        <label for="email">E-mailadres</label>
                        <input type="email" id="email" name="email" autocomplete="username" required minlength="2" placeholder="naam@voorbeeld.nl">

                        <label for="onderwerp">Wachtwoord</label>
                        <input id="onderwerp" type="password" name="password" autocomplete="current-password" required minlength="8" placeholder="Uw wachtwoord...">

                        <button id="loginButton" type="submit" disabled>Log in</button>
                    </form>
                    <p id="login-message" role="status"></p>
                </div> 
        </main>
        <script type="module" src="inloggen.js"></script>
    </body>
</html>
